[project]
name = "coursework1"
version = "0.1.0"
description = ""
authors = [
    {name = "Soldatov Sergei",email = "serg1801soldatov@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)"
]


[tool.mypy]
# Запрещает объявлять функции без аннотации типов.
disallow_untyped_defs = true
# Предупреждает, если функция возвращает значение типа Any
warn_return_any = true
# Файлы, которые не нужно форматировать
exclude = '.venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '.git'

[tool.isort]
# Импорты будут объединены в одну строку, если возможно.
multi_line_output = 3
# Mаксимальная длина строки
line_length = 119
